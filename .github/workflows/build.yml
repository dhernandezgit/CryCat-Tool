name: Build CryCat (Linux + Windows)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Build (onedir + instalador + archivo único)
        run: bash packaging/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: crycat-linux
          if-no-files-found: error
          path: |
            dist/crycat-linux-*.tar.gz
            dist/crycat-onefile

  windows:
    runs-on: windows-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Inno Setup (para el instalador con accesos directos)
        run: choco install innosetup --no-progress -y
      - name: Build (CryCat.exe + instalador)
        id: build
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          $log = "build-windows.log"
          "PS=$($PSVersionTable.PSVersion)  PWD=$PWD" | Tee-Object -FilePath $log
          "script existe: $(Test-Path '.\packaging\build_windows.ps1')" | Tee-Object -FilePath $log -Append
          try {
            & ".\packaging\build_windows.ps1" *>&1 | Tee-Object -FilePath $log -Append
          } catch {
            "EXCEPCION: $($_.Exception.Message)" | Tee-Object -FilePath $log -Append
            "EN LINEA: $($_.InvocationInfo.PositionMessage)" | Tee-Object -FilePath $log -Append
          }
          "EXITCODE=$LASTEXITCODE" | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Diagnóstico (publicar el error en un issue)
        if: steps.build.outcome == 'failure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (Test-Path build-windows.log)) { "sin log (no se generó transcripción)" | Out-File build-windows.log }
          $tail = (Get-Content build-windows.log -Tail 90) -join "`n"
          $titulo = "🛠️ Fallo del build de Windows"
          $cuerpo = "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`n`n" + '```text' + "`n$tail`n" + '```'
          $h = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "crycat-ci"; Accept = "application/vnd.github+json" }
          $json = @{ title = $titulo; body = $cuerpo; labels = @("ci") } | ConvertTo-Json
          $abiertos = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/issues?state=open" -Headers $h
          $prev = $abiertos | Where-Object { $_.title -eq $titulo -and -not $_.pull_request } | Select-Object -First 1
          if ($prev) {
            Invoke-RestMethod -Method Patch -Uri "https://api.github.com/repos/${{ github.repository }}/issues/$($prev.number)" -Headers $h -Body $json -ContentType "application/json" | Out-Null
          } else {
            Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/${{ github.repository }}/issues" -Headers $h -Body $json -ContentType "application/json" | Out-Null
          }
          Write-Host "log publicado en el issue de diagnóstico"
      - name: Subir CryCat.exe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crycat-windows
          if-no-files-found: warn
          path: dist/CryCat.exe
      - name: Subir instalador (si se generó)
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: crycat-windows-setup
          if-no-files-found: warn
          path: packaging/Output/crycat-setup.exe
      - name: Fallar el job si el build falló
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: exit 1

  release:
    # al empujar una etiqueta vX.Y.Z se publica la release con los archivos
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          name: CryCat ${{ github.ref_name }}
          body: |
            ## CryCat ${{ github.ref_name }}

            Coloca tus imágenes de forma óptima para Cricut, todo local y sin
            conexión a Internet (la app solo se conecta para avisarte de
            versiones nuevas).

            ### Descargar e instalar
            - **Windows (instalador automático, con accesos directos):**
              `crycat-setup.exe`
            - **Windows (un solo archivo, sin instalación):** `CryCat.exe`
            - **Linux (un solo archivo):** `crycat-onefile`
            - **Linux (paquete con instalador de menú):** `crycat-linux-*.tar.gz`
              (descomprimir y ejecutar `install.sh`)

            ### Actualizaciones automáticas
            Desde la propia aplicación, en la barra inferior, pulsa ⟳ para
            comprobar versiones y ⬇ para descargar, instalar y reiniciar sin
            perder nada (tus ajustes, perfiles e imágenes se conservan).

            Hecha por **Daniel Hernández Ferrándiz**.
          fail_on_unmatched_files: false
          files: |
            artefactos/**/CryCat.exe
            artefactos/**/crycat-setup.exe
            artefactos/**/crycat-linux-*.tar.gz
            artefactos/**/crycat-onefile
